# Runs when Vercel reports a production deployment ready (and on demand).
# Only the Brodie League project's production deploys are checked (their URLs
# end in -brodie-league.vercel.app); a leftover project in a former employee's
# account may still report on this repo.
# A failure means the live site is broken or a scheduled job has silently
# stopped; GitHub emails whoever triggered the deploy.
name: After deploy
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment_status.environment, 'Production') && contains(github.event.deployment_status.environment_url, '-brodie-league.vercel.app')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for the production alias to switch
        run: sleep 30
      - name: Smoke test
        run: node .github/scripts/smoke.mjs
        env:
          PROD_URL: https://brodie-leaguehealth.vercel.app
